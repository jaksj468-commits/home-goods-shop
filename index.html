<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="PEX is preparing a new way to discover products. A new experience is coming soon.">
  <title>Coming Soon — PEX</title>
  <style>
    *{box-sizing:border-box}
    html{min-height:100%;background:#0a0a0a}
    body{margin:0;min-height:100vh;background:#0a0a0a;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
    .header{height:86px;padding:0 7vw;display:flex;align-items:center;border-bottom:1px solid #292929}
    .brand{display:flex;align-items:center;gap:13px;color:#fff;text-decoration:none;font-size:18px;font-weight:800;letter-spacing:2px}
    .brand-mark{width:42px;height:42px;border:1px solid #f5f5f5;display:grid;place-items:center;font-size:15px;letter-spacing:0}
    .brand small{display:block;margin-top:4px;font-size:9px;font-weight:400;letter-spacing:2.3px;color:#999}
    main{width:100%;max-width:1100px;margin:auto;padding:100px 7vw 120px}
    .eyebrow{font-size:11px;letter-spacing:4px;color:#aaa;text-transform:uppercase;margin-bottom:32px}
    h1{font-size:clamp(54px,10vw,112px);line-height:.96;letter-spacing:-6px;font-weight:700;margin:0;max-width:900px}
    h1 span{display:block;color:#777}
    .rule{width:64px;height:2px;background:#eee;margin:48px 0 28px}
    .intro{font-size:clamp(17px,2.2vw,21px);line-height:1.7;color:#c5c5c5;max-width:570px;margin:0}
    .status{display:inline-flex;align-items:center;gap:10px;margin-top:48px;border:1px solid #444;padding:13px 17px;font-size:10px;letter-spacing:2.5px;color:#eee}
    .dot{width:7px;height:7px;background:#eee;border-radius:50%;display:inline-block}
    footer{border-top:1px solid #292929;padding:24px 7vw;color:#777;font-size:11px;letter-spacing:1px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
    @media(max-width:600px){.header{height:72px}main{padding-top:86px;padding-bottom:100px}h1{letter-spacing:-3px}.eyebrow{letter-spacing:3px}footer{line-height:1.7}}
  </style>
</head>
<body>
  <header class="header">
    <a class="brand" href="/" aria-label="PEX">
      <span class="brand-mark">PEX</span>
      <span>PEX<small>PRODUCT EXCHANGE</small></span>
    </a>
  </header>
  <main>
    <div class="eyebrow">A New Chapter Begins</div>
    <h1>Something<br><span>is coming.</span></h1>
    <div class="rule"></div>
    <p class="intro">We’re building a fresh destination for discovering thoughtfully selected products. A simpler, smarter shopping experience is on its way.</p>
    <div class="status"><span class="dot"></span> COMING SOON</div>
  </main>
  <footer>
    <span>© <span id="year"></span> PEX — PRODUCT EXCHANGE</span>
    <span>NEW EXPERIENCE. COMING SOON.</span>
  </footer>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
  <!-- Cloudflare Web Analytics -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"d100bcc714124bef8af37591b5c83a49"}'></script>
  <!-- End Cloudflare Web Analytics -->
</body>
</html>
